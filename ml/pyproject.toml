[project]
name = "geohazard-ml"
version = "0.1.0"
description = "Regional seismic risk profiling pipeline for GeoHazard PH"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "kagglehub~=1.0.2",
  "shapely>=2.1,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "DTZ", "RUF", "PERF"]

[tool.ruff.lint.isort]
known-first-party = ["ml"]
