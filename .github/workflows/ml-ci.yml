name: ML CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML package
        run: pip install -e "ml[dev]"
      - name: Run ML tests
        run: pytest -v
        working-directory: ml
      - name: Report Ruff findings
        continue-on-error: true
        run: ruff check .
        working-directory: ml
