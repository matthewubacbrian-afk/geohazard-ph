name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geohazard
          POSTGRES_PASSWORD: geohazard
          POSTGRES_DB: geohazard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geohazard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: Create test database
        working-directory: backend
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://geohazard:geohazard@localhost:5432/geohazard', autocommit=True); c.execute('CREATE DATABASE geohazard_test')"
      - run: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://geohazard:geohazard@localhost:5432/geohazard_test
