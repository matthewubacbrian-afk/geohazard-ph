name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geohazard
          POSTGRES_PASSWORD: geohazard
          POSTGRES_DB: geohazard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geohazard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: Check Python lint
        run: ruff check --config pyproject.toml .
        working-directory: backend
      - name: Verify staging release modes
        run: |
          ruff check scripts/verify_staging_config.py scripts/tests/test_deploy_staging.py
          python scripts/verify_staging_config.py
          python -m unittest discover -s scripts/tests -p 'test_deploy_staging.py' -v
      - name: Verify mobile build evidence
        run: |
          ruff check --config backend/pyproject.toml scripts/mobile_artifact_inventory.py scripts/mobile_process_coverage.py scripts/mobile_image_input_summary.py scripts/tests/test_mobile_artifact_inventory.py scripts/tests/test_mobile_process_coverage.py scripts/tests/test_mobile_image_input_summary.py scripts/tests/test_mobile_ci_workflow.py scripts/mobile_runtime_smoke.py scripts/tests/test_mobile_runtime_smoke.py
          PYTHONPATH=. pytest -q scripts/tests/test_mobile_artifact_inventory.py scripts/tests/test_mobile_process_coverage.py scripts/tests/test_mobile_image_input_summary.py scripts/tests/test_mobile_ci_workflow.py scripts/tests/test_mobile_runtime_smoke.py
      - name: Create test database
        working-directory: backend
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://geohazard:geohazard@localhost:5432/geohazard', autocommit=True); c.execute('CREATE DATABASE geohazard_test')"
      - run: pytest
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://geohazard:geohazard@localhost:5432/geohazard_test
          REDIS_URL: redis://localhost:6379/0
