services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geohazard
      POSTGRES_USER: geohazard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geohazard -d geohazard"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment: &backend_environment
      ENVIRONMENT: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      RISK_PROFILE_EXPORT_PATH: /data/risk_profiles.json
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    environment: *backend_environment
    volumes:
      - ${RISK_PROFILE_EXPORT_FILE:?set RISK_PROFILE_EXPORT_FILE}:/data/risk_profiles.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    command: ["sh", "-c", "while true; do python -m ingestion.scheduler; sleep 300; done"]
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
