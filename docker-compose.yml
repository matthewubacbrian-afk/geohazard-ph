services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geohazard
      POSTGRES_USER: geohazard
      POSTGRES_PASSWORD: geohazard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_postgis.sql:/docker-entrypoint-initdb.d/init_postgis.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://geohazard:geohazard@postgres:5432/geohazard
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "ingestion.scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://geohazard:geohazard@postgres:5432/geohazard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
