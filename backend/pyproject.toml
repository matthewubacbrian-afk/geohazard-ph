[project]
name = "geohazard-backend"
version = "0.1.0"
description = "GeoHazard PH backend and ingestion services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "geoalchemy2>=0.15.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]
exclude = ["db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
