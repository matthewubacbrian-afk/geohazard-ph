[project]
name = "geohazard-backend"
version = "0.1.0"
description = "GeoHazard PH backend and ingestion services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "geoalchemy2>=0.15.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "alembic>=1.13.0",
  "shapely>=2.0,<3",
  "fiona>=1.10,<2",
  "Pillow==12.3.0",
  "numpy==2.2.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]
exclude = ["db*"]

[tool.setuptools.package-data]
"app.core" = ["certificates/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "DTZ", "RUF", "PERF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingestion"]

[tool.ruff.lint.per-file-ignores]
# Applied migrations are immutable; retain only their existing style deviations.
"db/migrations/versions/0001_create_hazard_events.py" = ["I001", "UP007", "UP035"]
"db/migrations/versions/0002_add_hazard_event_canonical.py" = ["I001", "UP007", "UP035"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
