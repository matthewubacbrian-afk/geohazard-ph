server {
  listen 80;
  server_name _;

  location /ws/ {
    proxy_pass http://api:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
  }

  location / {
    proxy_pass http://web:5173/;
  }
}
